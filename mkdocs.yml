site_name: albireo
site_description: GPU-accelerated Bayesian spectral disentangling of double- and multiple-lined spectroscopic binaries
repo_url: https://github.com/tjayasinghe/albireo
repo_name: tjayasinghe/albireo

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Tutorials:
      - Disentangle an SB2 end to end: tutorials/sb2-end-to-end.md
      - Find a hidden companion with the K2 scan: tutorials/k2-scan.md
      - Bring your own spectra (FITS to Dataset): tutorials/real-data.md
  - Design: design.md
  - Mathematical foundations: math.md
  - Benchmarks: benchmarks.md

markdown_extensions:
  - admonition
  - footnotes
  - tables
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

extra_javascript:
  - javascripts/mathjax.js
  # Cloudflare-hosted mirror of polyfill.io; the original cdn.polyfill.io domain
  # was compromised in 2024 and must not be used.
  - https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
