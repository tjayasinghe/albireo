name: CI

# The routine workflow: one job on one runner with one Python version. It catches the
# failures that can occur on any commit: a lint error, a broken import, a failing fast test.
# The platform matrix, the acceptance tests and the example scripts are in `full.yml`,
# which is run on demand.
#
# The split exists because of billing. Actions minutes are free and unlimited on public
# repositories, but metered on private ones (2,000/month on the free tier), where Windows
# runners bill at 2x and macOS at 10x. This file previously held eight jobs including a
# four-way matrix, about 120 billed minutes per push, or sixteen pushes a month. It now
# holds one Linux job at about a seventh of that.
#
# The job runs on Linux because development happens on Windows. Local runs already test
# Windows, so CI covers the platform that is not tested locally, which is also the one
# most users will install on.

on:
  push:
    branches: [main]
    # A README or docs-only edit cannot break the test suite, and the Docs workflow still
    # runs on these to catch a broken link or an unresolvable docstring reference. If
    # `check` ever becomes a required status check, a skipped run counts as pending, so
    # branch protection and this filter need deciding together.
    paths-ignore: ["**.md", "docs/**", "paper/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "paper/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, guards, fast tests
    runs-on: ubuntu-latest
    # The cap guards against hangs, so it is set well above the real runtime. The fast
    # suite alone takes 12-16 minutes on the development machine. This job also runs two
    # cold `uv pip install` steps (the second venv is for the bare-install check) and an
    # uncached mypy pass, on a 4-vCPU runner that is slower per core. A cap of 25 minutes
    # was within that range, and a job killed by the timeout reports no test output.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Pinned to a point release. astral-sh/setup-uv publishes floating major-version tags
      # only up to `v7` (there is no `v8`, `v9` or `v10` ref of any kind), and an
      # unresolvable `uses:` fails the job during "Set up job", before a single step runs
      # and with no useful log. Bump this pin explicitly rather than replacing it with a
      # major alias that does not exist.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Create virtual environment and install package
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"

      # Lint first: it takes seconds, and a formatting failure should not wait behind ten
      # minutes of tests to be reported.
      - name: Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      # Advisory for now: the codebase has never been type-checked end to end, and JAX
      # annotations will produce a backlog of errors. The step becomes required once the
      # backlog is cleared.
      - name: Mypy (advisory)
        continue-on-error: true
        run: uv run --no-sync mypy src/albireo

      # A second environment with no extras, so astropy and matplotlib are absent. This
      # checks the optional-dependency guards: `import albireo` must work, and the optional
      # functions must raise an error that names the missing extra, not an ImportError from
      # inside a figure or a FITS writer. It is a second venv in the same job, which reuses
      # the checkout and the uv setup.
      - name: Bare install (no extras)
        run: |
          uv venv --python 3.13 /tmp/bare
          VIRTUAL_ENV=/tmp/bare uv pip install -e .
          /tmp/bare/bin/python - <<'PY'
          import importlib.util as u
          assert u.find_spec("astropy") is None, "this step must run without astropy"
          assert u.find_spec("matplotlib") is None, "this step must run without matplotlib"

          import numpy as np
          import albireo as ab
          print("albireo", ab.__version__)

          # The quickstart's first line, on a bare install. This also checks that the
          # packaged .npz made it into the distribution.
          dataset = ab.load_example()
          assert len(list(dataset)) == 12, dataset

          grid = ab.LogGrid.from_wavelength_range(5000.0, 5010.0, dv_kms=5.0)
          spectra = np.zeros((1, grid.n))

          for call, needle in (
              (lambda: ab.plot_spectra(grid, spectra), "albireo[plots]"),
              (lambda: ab.write_spectra("x.fits", grid, spectra), "albireo[io]"),
          ):
              try:
                  call()
              except (ImportError, ModuleNotFoundError) as exc:
                  assert needle in str(exc), f"unhelpful message: {exc}"
              else:
                  raise AssertionError(f"expected a guard mentioning {needle}")

          # The no-dependency export path must work as well.
          ab.write_ascii("spectra.txt", grid, spectra)
          print("bare install OK")
          PY

      # The acceptance tests (real NUTS sampling, the multi-minute closed-loop fits) and
      # the example scripts are in `full.yml`.
      - name: Fast tests
        run: uv run --no-sync pytest --no-slow --no-network
