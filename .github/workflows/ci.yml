name: CI

# The routine loop: one job, one runner, one Python. It catches the failures that can occur
# on every commit: a lint slip, a broken import, a failing fast test. It is not the whole
# test plan. The matrix, the acceptance gates and the example scripts live in `full.yml`,
# which is run on demand.
#
# The reason is billing. Actions minutes are free and unlimited on public repositories, but
# metered on private ones (2,000/month on the free tier), where Windows runners bill at 2x
# and macOS at 10x. The previous shape of this file was eight jobs including a four-way
# matrix, about 120 billed minutes per push, or sixteen pushes a month. This is one job,
# on Linux, at about a seventh of that.
#
# Linux specifically, because development happens on Windows: local runs already supply the
# Windows signal, so CI covers the platform that is not tested by hand, which is also the
# one most users will install on.

on:
  push:
    branches: [main]
    # A README or docs-only edit cannot break the test suite, and the Docs workflow still
    # runs on these to catch a broken link or an unresolvable docstring reference. If
    # `check` ever becomes a required status check, a skipped run counts as pending, so
    # branch protection and this filter need deciding together.
    paths-ignore: ["**.md", "docs/**", "paper/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "paper/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, guards, fast tests
    runs-on: ubuntu-latest
    # The cap guards against hangs, so it sits well clear of the real runtime. The fast
    # suite alone measures 12-16 minutes on the development machine, and this job also pays
    # for two cold `uv pip install` runs (the second venv for the bare-install guard) and an
    # uncached mypy pass, on a 4-vCPU runner that is slower per core. 25 was inside that
    # envelope, and a timeout kill reports no test output at all.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Pinned to a point release. astral-sh/setup-uv publishes floating major-version tags
      # only up to `v7` (there is no `v8`, `v9` or `v10` ref of any kind), and an
      # unresolvable `uses:` fails the job during "Set up job", before a single step runs
      # and with no useful log. Bump this pin explicitly rather than replacing it with a
      # major alias that does not exist.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Create virtual environment and install package
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"

      # Lint first: it takes seconds, and a formatting failure should not wait behind ten
      # minutes of tests to be reported.
      - name: Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      # Not gating yet: the codebase has never been type-checked end to end and JAX
      # annotations will produce a backlog. Visible now, enforced once the backlog is
      # cleared.
      - name: Mypy (advisory)
        continue-on-error: true
        run: uv run --no-sync mypy src/albireo

      # A second environment with no extras, so astropy and matplotlib are absent. This
      # checks that the optional-dependency guards hold: `import albireo` must work, and
      # the optional surfaces must raise an actionable error naming the extra rather than
      # an ImportError from somewhere inside a figure or a FITS writer. It is a separate
      # venv but not a separate job, since the checkout and the uv setup are already paid
      # for here.
      - name: Bare install (no extras)
        run: |
          uv venv --python 3.13 /tmp/bare
          VIRTUAL_ENV=/tmp/bare uv pip install -e .
          /tmp/bare/bin/python - <<'PY'
          import importlib.util as u
          assert u.find_spec("astropy") is None, "this step must run without astropy"
          assert u.find_spec("matplotlib") is None, "this step must run without matplotlib"

          import numpy as np
          import albireo as ab
          print("albireo", ab.__version__)

          # The quickstart's first line, on a bare install. This also checks that the
          # packaged .npz made it into the distribution.
          dataset = ab.load_example()
          assert len(list(dataset)) == 12, dataset

          grid = ab.LogGrid.from_wavelength_range(5000.0, 5010.0, dv_kms=5.0)
          spectra = np.zeros((1, grid.n))

          for call, needle in (
              (lambda: ab.plot_spectra(grid, spectra), "albireo[plots]"),
              (lambda: ab.write_spectra("x.fits", grid, spectra), "albireo[io]"),
          ):
              try:
                  call()
              except (ImportError, ModuleNotFoundError) as exc:
                  assert needle in str(exc), f"unhelpful message: {exc}"
              else:
                  raise AssertionError(f"expected a guard mentioning {needle}")

          # The no-dependency export path must work as well.
          ab.write_ascii("spectra.txt", grid, spectra)
          print("bare install OK")
          PY

      # The acceptance gates (real NUTS sampling, the multi-minute closed-loop fits) and
      # the example scripts are in `full.yml`.
      - name: Fast tests
        run: uv run --no-sync pytest --no-slow --no-network
