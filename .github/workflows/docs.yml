name: Docs

# Two jobs, both cheap, and not filtered by path: mkdocstrings imports the package to read
# its docstrings, so a source-only change can break `--strict` just as easily as a docs one.
# This workflow still runs when `ci.yml` skips a docs-only push.
#
# The deploy job needs Pages set to "GitHub Actions" in the repository settings, and Pages
# from a private repository requires GitHub Pro; on the free tier it only works once the
# repository is public. Because neither is true before the first push, deploy is gated
# behind the `PAGES_ENABLED` repository variable; the build job runs regardless, so a broken
# docs build is still caught. See internal/releasing.md step 2.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # A point release, not a major alias: setup-uv's floating major-version tags stop at
      # `v7`, so `@v10` would not resolve even though `v10.0.1` exists. See ci.yml.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Create virtual environment and install package
        # mkdocstrings imports the package to read its docstrings, so the docs build needs
        # the runtime dependencies as well as the docs ones.
        run: |
          uv venv --python 3.13
          uv pip install -e ".[docs]"

      # --strict turns a broken internal link or an unresolvable docstring reference into a
      # failure. The API reference is generated from the source, so this is also a check
      # that the docstrings still refer to things that exist.
      - name: Build
        run: uv run --no-sync mkdocs build --strict

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # Gated on a repository variable rather than run unconditionally. `deploy-pages` calls the
  # Pages API and hard-fails with a 404 if Pages has not been switched to "GitHub Actions" in
  # the settings, and on the free tier that switch is unavailable while the repository is
  # private. Left ungated, every push to main would leave a red Docs run carrying no
  # information. Set the variable once Pages is on:  gh variable set PAGES_ENABLED --body true
  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
