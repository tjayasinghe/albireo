name: Full

# Everything `ci.yml` deliberately leaves out: the platform/version matrix, the acceptance
# gates with coverage, and the example scripts. Run it **on demand** — the Actions tab,
# "Full", "Run workflow" — rather than on every push, because on a private repository it is
# expensive and most commits do not need it. Order-of-magnitude, from the suite times
# measured locally and *not* yet from a real run: the matrix is four jobs at ~15 min each
# but Windows bills at 2x, so ~95 billed minutes; the gates job is the ~37-minute full
# suite plus coverage; the examples job ~15. Call it 150+ billed minutes a go, i.e. under
# fifteen runs a month on the free tier — and none of it charged once the repo is public.
#
# There is no `schedule:` here on purpose. A weekly run would spend a quarter of the free
# tier's monthly minutes re-testing commits that have not changed, and GitHub disables
# scheduled workflows on inactive repositories anyway.
#
# When to actually run it: before tagging a release (`docs/releasing.md` step 1), after
# touching the solver, the assembly, or anything else the fast suite only covers at small
# scale, and whenever `ci.yml` passes but you do not believe it.

on:
  workflow_dispatch:
    inputs:
      matrix:
        description: "Run the OS/Python matrix"
        type: boolean
        default: true
      gates:
        description: "Run the slow acceptance gates with coverage"
        type: boolean
        default: true
      examples:
        description: "Run the example scripts"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    if: inputs.matrix
    runs-on: ${{ matrix.os }}
    # Same workload as ci.yml's `check` — see the timeout note there — but also on Windows,
    # which is slower to install and slower to run. Kept in step with that job at 45.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      # A point release, not a major alias: setup-uv's floating major-version tags stop at
      # `v7`, so `@v10` would not resolve even though `v10.0.1` exists. See ci.yml.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment and install package
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      # The gates run once, below, rather than four times across the matrix.
      - name: Run tests
        run: uv run --no-sync pytest --no-slow --no-network

  gates:
    name: Acceptance gates (slow)
    if: inputs.gates
    runs-on: ubuntu-latest
    # The M3 NUTS gate is a few minutes of real sampling; a hung chain (say a mass-matrix
    # regression driving trees to the depth cap) must fail rather than idle. The cap has to
    # clear the real thing by a wide margin, though: a bare `pytest` measures 36m25s on the
    # development machine (633 passed, 1 skipped), and this job adds a cold dependency
    # install and coverage tracing on a runner that is slower per core. 45 left barely eight
    # minutes over the measured suite alone, so any of those three costs would have killed
    # the job — and a timeout kill reports no result at all.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # A point release, not a major alias: setup-uv's floating major-version tags stop at
      # `v7`, so `@v10` would not resolve even though `v10.0.1` exists. See ci.yml.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Create virtual environment and install package
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"

      - name: Run the full suite with coverage
        run: uv run --no-sync pytest --no-network --cov=albireo --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  examples:
    name: Examples (smoke)
    if: inputs.examples
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # A point release, not a major alias: setup-uv's floating major-version tags stop at
      # `v7`, so `@v10` would not resolve even though `v10.0.1` exists. See ci.yml.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.13

      - name: Create virtual environment and install package
        run: |
          uv venv --python 3.13
          uv pip install -e ".[dev]"

      # Each script ends in assertions, so these are gates rather than smoke tests; the
      # name is historical. ALBIREO_EXAMPLE_FAST cuts the trial counts and grid sizes,
      # leaving every conclusion intact. 03_hr6819 is absent because it needs 153 MB of
      # archival FEROS spectra, and 06_bloem because it queries the ESO archive.
      - name: Run examples
        env:
          ALBIREO_EXAMPLE_FAST: "1"
        run: |
          uv run --no-sync python examples/00_quickstart.py
          uv run --no-sync python examples/02_k2_scan.py
          uv run --no-sync python examples/04_nebular.py
          uv run --no-sync python examples/05_detection_limit.py
          uv run --no-sync python examples/08_forecast.py
          uv run --no-sync python examples/09_rv_table.py
          uv run --no-sync python examples/10_downstream.py
          uv run --no-sync python examples/01_sb2_end_to_end.py
