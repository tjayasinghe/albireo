[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "albireo"
# Single-sourced from src/albireo/__init__.py (see [tool.hatch.version]); `albireo.__version__`
# and the installed distribution metadata can therefore never disagree. tests/test_metadata.py
# asserts that, and that CITATION.cff — the one copy no build backend can read — agrees too.
dynamic = ["version"]
description = "GPU-accelerated Bayesian spectral disentangling of double- and multiple-lined spectroscopic binaries"
readme = "README.md"
# >=3.12 because current jaxlib (0.11.x) no longer ships cp311 wheels
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Tharindu Jayasinghe", email = "tharindujay96@gmail.com" }]
maintainers = [{ name = "Tharindu Jayasinghe", email = "tharindujay96@gmail.com" }]
keywords = [
    "astronomy",
    "spectroscopy",
    "binaries",
    "spectral-disentangling",
    "JAX",
    "bayesian-inference",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26",
    # scipy: banded SPD solves for the continuum smoother in albireo.preprocess.
    # Already a hard dependency of jax, so this costs nothing to declare and is honest.
    "scipy>=1.11",
    "jax>=0.5",
    "numpyro>=0.16",
    "optax>=0.2",
]

[project.optional-dependencies]
# Reading spectra from FITS (albireo.io). Optional: the rest of the package never
# imports astropy, so users who already hold arrays in memory need not install it.
io = ["astropy>=6"]
# Figures and posterior diagnostics (albireo.plotting, albireo.results.to_inference_data).
# Optional for the same reason astropy is: a fit running on a headless cluster node should
# not have to install a plotting stack.
plots = ["matplotlib>=3.8", "arviz>=0.18"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit",
    "astropy>=6",
    "matplotlib>=3.8",
    "arviz>=0.18",
    # The netCDF engine xarray falls back to when netCDF4 is absent. It gates exactly one
    # test — tests/test_results.py::test_inference_data_round_trips_through_netcdf — which
    # is the only coverage of the arviz export surface, `to_inference_data(...).to_netcdf()`.
    # Without it that test `importorskip`s away and the bridge's on-disk format is exercised
    # nowhere. Unrelated to `save_fit`/`load_fit`, which are `.npz` and need nothing extra.
    #
    # h5py is not redundant: h5netcdf is a pure-Python *interface* and raises ImportError at
    # call time without an HDF5 backend. Listing h5netcdf alone converts that skip into a
    # failure, which is strictly worse than the skip it was meant to remove.
    "h5netcdf",
    "h5py",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]",
    "mkdocs-jupyter",
    # Not a linter here. mkdocstrings-python line-wraps a `separate_signature:` signature
    # only if Black or Ruff is importable, and otherwise silently emits it on one line
    # (`_get_formatter` falls back to the identity function). The dev venv has ruff, so
    # without this the site built locally and the site deployed from CI differ, and
    # --strict does not notice.
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/tjayasinghe/albireo"
Issues = "https://github.com/tjayasinghe/albireo/issues"

[project.scripts]
# `albireo init | run | demo | fetch` -- the pipeline's command line (albireo.cli).
albireo = "albireo.cli:main"

[tool.hatch.version]
path = "src/albireo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/albireo"]
# The packaged example dataset (albireo.examples.load_example) and the PEP 561 marker are
# data files, not modules, so they are listed explicitly rather than picked up as Python.
artifacts = ["src/albireo/data_files/*.npz", "src/albireo/py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Recent ruff formats Python code blocks inside Markdown as well as .py files. The docs
# align inline comments deliberately — it is what makes a long argument list readable in a
# tutorial — and reformatting would collapse that alignment across every page. The prose is
# reviewed by reading it, not by a formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# The notebook builders hold their pages' Markdown as Python string literals, so RUF001's
# ambiguous-character rule fires on typography that is correct where it is rendered: a real
# sigma, a multiplication sign, an en dash. The prose is reviewed by reading it.
"scripts/build_*_notebook.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-q` for signal; `--strict-markers` so a typo'd marker is an error rather than a test
# that silently never runs.
addopts = "-q --strict-markers"
# tests/ has no __init__.py, so pytest's prepend import mode puts tests/ — not the repo
# root — on sys.path, and the cross-module helper imports (`from tests.test_likelihood
# import dense_marginal` in test_ar1/test_lsf_h3/test_lsf_varying) fail to collect under
# the `pytest` console script. They only worked under `python -m pytest`, which adds the
# working directory itself. Declaring the path here makes both invocations equivalent.
pythonpath = ["."]
markers = [
    "slow: real sampling or multi-minute closed-loop fits; deselect with -m 'not slow'",
    "network: needs the public internet (archive queries, example-data downloads)",
    "gpu: needs a JAX GPU backend",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
